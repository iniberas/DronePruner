version: '3.8'

services:
  ros2-gazebo:
    build: .
    container_name: ros2-gazebo
    network_mode: "host" 
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/workspace
    stdin_open: true 
    tty: true